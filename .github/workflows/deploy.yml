name: Deploy static site

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the upload without changing GreenGeeks"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Preview or upload site to GreenGeeks
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.GG_FTP_SERVER }}
          username: ${{ secrets.GG_FTP_USERNAME }}
          password: ${{ secrets.GG_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          server-dir: ./
          dry-run: ${{ inputs.dry_run }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.well-known/**
            cgi-bin/**
            staging.dietitianhealthconsult.com/**
